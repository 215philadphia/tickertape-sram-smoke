name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  collect:
    # Publishes statuses, log excerpts and text reports to a results-<sha>-<run> branch (see collect-results.yaml)
    needs: [gds, precheck, gl_test]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch results collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-results.yaml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f commit_sha="${{ github.sha }}"
